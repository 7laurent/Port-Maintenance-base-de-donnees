<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OMP Maintenance</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="page2"> 

    <header class="topbar">
        <div class="logo">
            <span>OMP</span>
            <div>
                <strong>Work Order</strong>
                <small>Maintenance</small>
            </div>
        </div>

        <div class="user">
            Administrateur
        </div>
    </header>

    <body class="page2">
            <form class="form-card">

                <div class="section-title">
                    information
                </div>
                <div class="form-grid">
                    <div class="field">
                        <label>
                            Code intervention
                        </label>
                        <input
                            type="text"
                            placeholder="Ex : WO-005"
                        >
                    </div>

                    <div class="field">
                        <label>
                            Équipement
                        </label>
                        <select>
                            <option value="">
                                Sélectionner un équipement
                            </option>
                            <option>
                                EQ-001 — Caterpillar 320
                            </option>
                            <option>
                                EQ-002 — Toyota Hilux
                            </option>
                            <option>
                                EQ-003 — Komatsu WA200
                            </option>
                            <option>
                                EQ-004 — Volvo A40
                            </option>

                        </select>

                    </div>

                    <div class="field">
                        <label>
                            Type de maintenance
                        </label>
                        <select>
                            <option>
                                Preventive Maintenance
                            </option>
                            <option>
                                Corrective Maintenance
                            </option>
                        </select>
                    </div>

                    <div class="field">
                        <label>
                            Priorité
                        </label>
                        <select>
                            <option>
                                LOW
                            </option>
                            <option>
                                MEDIUM
                            </option>
                            <option>
                                HIGH
                            </option>
                            <option>
                                CRITICAL
                            </option>
                        </select>
                    </div>
                </div>


                <div class="section-title">
                    Planification
                </div>
                <div class="form-grid">
                    <div class="field">
                        <label>
                            Début prévu
                        </label>
                        <input
                            type="datetime-local"
                        >
                    </div>

                    <div class="field">
                        <label>
                            Fin prévue
                        </label>
                        <input
                            type="datetime-local"
                        >
                    </div>

                    <div class="field">
                        <label>
                            Début réel
                        </label>
                        <input
                            type="datetime-local"
                        >
                    </div>

                    <div class="field">

                        <label>
                            Fin réelle
                        </label>

                        <input
                            type="datetime-local"
                        >

                    </div>

                </div>


                <div class="section-title">
                    État de l'intervention
                </div>

                <div class="form-grid">
                    <div class="field">
                        <label>
                            Statut
                        </label>
                        <select>
                            <option>
                                PLANNED
                            </option>
                            <option>
                                IN_PROGRESS
                            </option>
                            <option>
                                COMPLETED
                            </option>
                            <option>
                                CANCELLED
                            </option>
                        </select>
                    </div>

                    <div class="checkbox-field">
                        <input
                            type="checkbox"
                            id="resolved"
                        >
                        <label for="resolved">
                            Problème résolu
                        </label>
                    </div>

                    <div class="checkbox-field">
                        <input
                            type="checkbox"
                            id="rework"
                        >
                        <label for="rework">
                            Rework nécessaire
                        </label>
                    </div>

                </div>
                <div class="section-title">
                    Commentaires
                </div>

                <div class="field">
                    <label>
                        Description / commentaires
                    </label>
                    <textarea
                        placeholder="Décrire l'intervention..."
                    ></textarea>
                </div>

                <div class="form-actions">
                    <button
                        type="button"
                        class="cancel"
                    >
                        Annuler
                    </button>
                    <button
                        type="submit"
                        class="save"
                    >
                        Enregistrer l'intervention
                    </button>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
